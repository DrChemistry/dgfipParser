[package]
name = "dgfip-parser"
version = "0.1.0"
description = "Local-only DGFIP PDF amount checker"
authors = ["DGFIP Parser"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "dgfip_parser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true
